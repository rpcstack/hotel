[package]
name = "hotel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "hotel_client_bench"
path = "src/client/client_bench.rs"

[[bin]]
name = "hotel_policy_probe"
path = "src/probe/main.rs"

[[bin]]
name = "hotel_http_check"
path = "src/http_check/main.rs"

[[bin]]
name = "hotel_frontend"
path = "src/frontend/main.rs"

[[bin]]
name = "hotel_geo"
path = "src/geo/main.rs"

[[bin]]
name = "hotel_rate"
path = "src/rate/main.rs"

[[bin]]
name = "hotel_review"
path = "src/review/main.rs"

[[bin]]
name = "hotel_search"
path = "src/search/main.rs"

[[bin]]
name = "hotel_profile"
path = "src/profile/main.rs"

[[bin]]
name = "hotel_reservation"
path = "src/reservation/main.rs"

[[bin]]
name = "hotel_user"
path = "src/user/main.rs"

[[bin]]
name = "hotel_recommendation"
path = "src/recommendation/main.rs"

[[bin]]
name = "loadgen"
path = "src/loadgen/main.rs"

[features]
# Policy modes. `baseline` (no features) is the framework default: no-op hooks
# (`tonic::rpcstack::noop::NoopHooks`) and the default FIFO run queue.
default = []
baseline = []
# The RPC policy (run queue + module stack) comes from the `policy/` crate,
# initially a no-op. Stubs default to `hotel_policy::Hooks`. Build it with
# `--features policy`.
policy = ["dep:hotel-policy"]

# Application knobs inherited from the original benchmark.
synthetic = []
workload_stats = []

[dependencies]
tonic = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
app-utils = { path = "../app-utils" }
hotel-policy = { path = "../../policy", optional = true }
anyhow = "1.0"
chrono = "0.4.38"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
geo = "0.28"
http = "0.2"
form_urlencoded = "1"
hyper = { version = "0.14", features = ["server", "client", "http1", "tcp"] }
kiddo = "4.2.1"
log = "0.4"
mongodb = "=2.8.2"
prost = "0.12"
rand = "0.8"
rand_distr = "0.4"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
structopt = "0.3.23"

[dev-dependencies]
rpcstack-tonic = { workspace = true }
rpcstack-sched = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = "3"
