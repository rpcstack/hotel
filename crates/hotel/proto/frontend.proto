syntax = "proto3";

package frontend;

service Frontend {
  rpc HandlePing(PingRequest) returns (PingResponse) {}
  rpc HandleSearch(SearchRequest) returns (SearchResponse) {}
  rpc HandleReservation(ReservationRequest) returns (ReservationResponse) {}
  rpc HandleReview(ReviewRequest) returns (ReviewResponse) {}
  // Added for the HTTP frontend (src/frontend/http.rs); the load generator
  // (client_bench) does not use them.
  rpc HandleUser(UserRequest) returns (UserResponse) {}
  rpc HandleRecommendation(RecommendationRequest) returns (RecommendationResponse) {}
  rpc HandleRates(RatesRequest) returns (RatesResponse) {}
}

message PingRequest { string message = 1; }

message PingResponse { string message = 1; }

message SearchRequest {
  double lat = 1;
  double lon = 2;
  string inDate = 3;
  string outDate = 4;
  optional string locale = 5;
}

message SearchResponse {
  repeated Hotel hotels = 1;
  repeated string childTraces = 2;
  // Per-service queueing latency (initial + resume, microseconds).
  // Populated only when the binary is built with trace_queue_latency.
  uint64 searchQueueingLatency = 3;
  uint64 reservationQueueingLatency = 4;
  uint64 profileQueueingLatency = 5;
}

message Hotel {
  string name = 1;
  string id = 2;
  string phoneNumber = 3;
  float lat = 4;
  float lon = 5;
}

// message Address {
//   string streetNumber = 1;
//   string streetName = 2;
//   string city = 3;
//   string state = 4;
//   string country = 5;
//   string postcalCode = 6;
//   float lat = 7;
//   float lon = 8;
// }

// message Image { string url = 1; }

message ReservationRequest {
  string username = 1;
  string password = 2;
  string customer = 11;
  repeated string hotels = 12;
  string inDate = 13;
  string outDate = 14;
  uint32 numRooms = 15;
}

message ReservationResponse {
  repeated string hotels = 1;
  // Per-service queueing latency (initial + resume, microseconds).
  // Populated only when the binary is built with trace_queue_latency.
  uint64 userQueueingLatency = 2;
  uint64 reservationQueueingLatency = 3;
  // False when the user check failed (then no reservation was attempted and
  // `hotels` is empty); true when it passed, whatever the reservation's outcome.
  bool userCorrect = 4;
}

message ReviewRequest {
  string hotelId = 1;
}

message ReviewResponse {
  repeated ReviewComm reviews = 1;
}

message ReviewComm {
  string reviewId = 1;
  string hotelId = 2;
  string name = 3;
  float rating = 4;
  string description = 5;
  repeated Image images = 6;
}

message Image {
  string url = 1;
  bool default = 2;
}

message UserRequest {
  string username = 1;
  string password = 2;
}

message UserResponse { bool correct = 1; }

message RecommendationRequest {
  // "dis", "rate" or "price".
  string require = 1;
  double lat = 2;
  double lon = 3;
  optional string locale = 4;
}

message RecommendationResponse { repeated Hotel hotels = 1; }

message RatesRequest { string hotelId = 1; }

message RatesResponse {
  repeated RatePlan ratePlans = 1;
}

message RatePlan {
  string code = 1;
  string inDate = 2;
  string outDate = 3;
  RoomType roomType = 4;
}

message RoomType {
  string code = 1;
  string roomDescription = 2;
  double bookableRate = 3;
  double totalRate = 4;
  double totalRateInclusive = 5;
}
