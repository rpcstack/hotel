name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, check and test (all modes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check (fmt, rpcstack pin, single tokio/hyper, -D warnings, all modes)
        run: scripts/check.sh
      - name: Test (all modes)
        run: scripts/test.sh

  compose-smoke:
    name: docker build + compose smoke (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, masa, policy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Dependencies are a separate cargo-chef layer (see Dockerfile); persist it
      # in the Actions cache so only the hotel crates compile on a warm run.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODE=${{ matrix.mode }}
          tags: rpcstack-hotel:${{ matrix.mode }}
          load: true
          cache-from: type=gha,scope=hotel-${{ matrix.mode }}
          cache-to: type=gha,scope=hotel-${{ matrix.mode }},mode=max
      - name: Compose smoke
        env:
          SKIP_BUILD: "1"
          COMPOSE_PROJECT_NAME: rpcstack-hotel-${{ matrix.mode }}
        run: scripts/smoke-compose.sh ${{ matrix.mode }}
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-compose-${{ matrix.mode }}
          path: out/
