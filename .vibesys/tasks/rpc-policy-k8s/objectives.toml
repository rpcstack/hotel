# From the base's samples on vibesys-k8s (README.md, "Baseline"): three samples within 2.0%
# (throughput) and 2.6% (p99) of each other; the noise is three times that, rounded up.
[[objective]]
name = "operations_per_second"
direction = "max"
relative_noise = 0.06

[[objective]]
name = "latency_ms.p99"
direction = "min"
relative_noise = 0.08

[pareto]
relative_noise = 0.08
