        app.kubernetes.io/component: hotel
        app.kubernetes.io/name: user
    spec:
      containers:
      - args:
        - user
        env:
        - name: LOG_LEVEL
          value: info
        image: ${HOTEL_IMAGE}
        imagePullPolicy: Always
        name: user
        ports:
        - containerPort: 8669
          name: grpc
        readinessProbe:
          periodSeconds: 3
          tcpSocket:
            port: 8669
        volumeMounts:
        - mountPath: /etc/hotel
          name: config
          readOnly: true
      volumes:
      - configMap:
          name: hotel-config
        name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: mongo
    app.kubernetes.io/name: user-mongo
  name: user-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mongo
        app.kubernetes.io/name: user-mongo
    spec:
      containers:
      - args:
        - --quiet
        - --wiredTigerCacheSizeGB
        - "0.25"
        image: mongo:7.0
        name: mongo
        ports:
        - containerPort: 27017
        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - 'db.runCommand({ping: 1}).ok'
          periodSeconds: 3
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /data/db
          name: data
      volumes:
      - emptyDir: {}
        name: data
