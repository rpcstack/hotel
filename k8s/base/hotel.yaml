# The nine hotel services. The container argument selects the binary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/component: hotel}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/component: hotel}
    spec:
      containers:
        - name: frontend
          image: rpcstack-hotel
          args: ["frontend"]
          env: [{name: LOG_LEVEL, value: info}]
          ports: [{name: grpc, containerPort: 8660}, {name: http, containerPort: 5000}]
          readinessProbe:
            tcpSocket: {port: 5000}
            periodSeconds: 3
          volumeMounts: [{name: config, mountPath: /etc/hotel, readOnly: true}]
      volumes:
        - name: config
          configMap: {name: hotel-config}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/component: hotel}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports:
    - name: grpc
      port: 8660
      targetPort: 8660
    - name: http
      port: 5000
      targetPort: 5000
---
