# MongoDB and Redis backends (ephemeral storage).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-mongo
  labels: {app.kubernetes.io/name: profile-mongo, app.kubernetes.io/component: mongo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: profile-mongo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: profile-mongo, app.kubernetes.io/component: mongo}
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          args: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]
          ports: [{containerPort: 27017}]
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
            periodSeconds: 3
            timeoutSeconds: 5
          volumeMounts: [{name: data, mountPath: /data/db}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: profile-mongo
  labels: {app.kubernetes.io/name: profile-mongo, app.kubernetes.io/component: mongo}
spec:
  selector: {app.kubernetes.io/name: profile-mongo}
  ports:
    - name: db
      port: 27017
      targetPort: 27017
---
