  labels: {app.kubernetes.io/name: profile-redis, app.kubernetes.io/component: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: profile-redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: profile-redis, app.kubernetes.io/component: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 3
