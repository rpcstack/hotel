# The policy/ directory's RPC policy (run queue + module stack): same manifests,
# image built with MODE=policy. Starts out equal to the masa preset.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: localhost:5001/rpcstack-hotel
    newTag: policy
